  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  :root{
    --ink:#0C1015; --card:#151B23; --card2:#1D252F; --line:#2A3441;
    --bone:#E6EBEF; --dim:#8693A2; --wolf:#8FA3B8;
    --push:#D2543C; --pull:#4E9E8B; --legs:#D19A2B; --upper:#7C89C4; --notes:#7F93A8;
    --up:#6FB58C; --down:#B4634E;
    --accent:var(--push);
  }

  html{background:var(--ink)}
  body{background:var(--ink);color:var(--bone);font-family:'Barlow',system-ui,sans-serif;
       font-size:16px;line-height:1.45;padding-bottom:64px}
  .wrap{max-width:560px;margin:0 auto}
  .top{padding-top:env(safe-area-inset-top)}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}

  .top{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
  .brand b{font-family:'CloneWars','Rajdhani',sans-serif;font-weight:400;font-size:21px;letter-spacing:.14em;line-height:1;display:block}
  .brand span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
              color:var(--dim);text-transform:uppercase}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;min-width:74px;background:none;border:0;cursor:pointer;padding:9px 12px 11px;
       font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
       color:var(--dim);border-bottom:3px solid transparent;transition:color .15s}
  .tab small{display:block;font-size:9px;opacity:.55;letter-spacing:.08em;margin-top:2px}
  .tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--c)}
  .tab:focus-visible{outline:2px solid var(--bone);outline-offset:-3px}

  .plate{padding:22px 16px 16px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--accent)}
  .plate h1{font-family:'CloneWars','Rajdhani',sans-serif;font-weight:400;font-size:50px;line-height:.9;letter-spacing:.04em;margin:8px 0 8px}
  .plate p{color:var(--dim);font-size:14.5px}
  .meter{display:flex;align-items:center;gap:10px;margin-top:14px}
  .bar{flex:1;height:5px;background:var(--card2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
  .meter span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);
              letter-spacing:.06em;white-space:nowrap}
  .banner{margin:14px 16px 0;padding:11px 13px;background:var(--card);border-left:3px solid var(--accent);
          font-size:13.5px;color:#C9D1D9;border-radius:0 6px 6px 0}

  .card{border-bottom:1px solid var(--line);background:var(--ink)}
  .card.done{background:#10151C}
  .head{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;
        border:0;color:inherit;cursor:pointer;padding:15px 16px;font-family:inherit}
  .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .num{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--accent);
       padding-top:3px;min-width:20px}
  .done .num{color:var(--dim)}
  .body{flex:1;min-width:0}
  .name{font-family:'CloneWars',sans-serif;font-size:20px;font-weight:400;letter-spacing:.02em;line-height:1.2;display:block}
  .done .name{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px}
  .target{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
          text-transform:uppercase;color:var(--dim);margin-top:5px;display:block}
  .pick{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 10px;
        background:var(--card2);border-radius:5px;font-size:14px;font-weight:500;max-width:100%}
  .pick b{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:10px;
          letter-spacing:.1em;font-weight:600}
  .prev{margin-top:8px;font-size:12.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace;display:block}
  .tally{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--bone);display:block}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding-top:2px}
  .sets{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--bone);
        background:var(--card2);padding:3px 7px;border-radius:4px;white-space:nowrap}
  .tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:none;
        cursor:pointer;display:grid;place-items:center;color:transparent;font-size:15px;transition:.15s}
  .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .done .tick{background:var(--accent);border-color:var(--accent);color:var(--ink)}
  .chev{color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace;transition:transform .2s}
  .open .chev{transform:rotate(180deg)}

  .panel{padding:0 16px 18px 48px;display:none}
  .open .panel{display:block}
  .opthead{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);margin:0 0 9px}

  .optrow{display:flex;align-items:stretch;gap:6px;margin-bottom:7px}
  .optrow .opt{flex:1;margin-bottom:0}
  .help{flex:none;width:38px;border:1px solid var(--line);background:var(--card);color:var(--dim);
        border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:14px;cursor:pointer;
        transition:.12s;-webkit-appearance:none}
  .help:active,.help.on{border-color:var(--accent);color:var(--accent);background:var(--card2)}
  .help:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .guide{background:var(--card2);border:1px solid var(--line);border-radius:7px;
         padding:13px;margin:-1px 0 7px;display:flex;gap:13px;align-items:flex-start}
  .guide img{flex:none;width:104px;background:#E6EBEF;border-radius:5px;padding:5px}
  .gtx{flex:1;min-width:0}
  .guide p{font-size:13.5px;line-height:1.45;color:#BCC6D0;margin:0 0 10px}
  .vid{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;
       font-family:inherit;color:var(--accent);text-decoration:none;border:1px solid var(--accent);
       border-radius:6px;padding:8px 12px}
  .vid:active{background:var(--accent);color:var(--ink)}
  .cred{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.07em;
        color:var(--dim);text-transform:uppercase;margin:8px 0 0}
  @media(max-width:400px){.guide{flex-direction:column;align-items:stretch;gap:11px}
                          .guide img{width:100%;max-width:150px;align-self:center}}

  .opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;
       font-size:15.5px;color:#D5DCE3;background:var(--card);border:1px solid transparent;
       border-radius:7px;padding:12px 13px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .opt .dot{width:15px;height:15px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
  .opt.on{border-color:var(--accent);background:var(--card2);color:var(--bone);font-weight:500}
  .opt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card2)}
  .opt .flag{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;
             letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
  .opt .stale{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;
              letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

  .log{margin-top:16px;border-top:1px solid var(--line);padding-top:15px}
  .goal{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border-radius:7px;
        background:var(--card);margin-bottom:13px}
  .goal .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
           text-transform:uppercase;padding-top:3px;white-space:nowrap}
  .goal.rise{background:rgba(111,181,140,.12)}
  .goal.rise .k{color:var(--up)}
  .goal.hold .k{color:var(--accent)}
  .goal.none .k{color:var(--dim)}
  .goal .v{font-size:14.5px;color:#CDD5DD;line-height:1.4}
  .goal .v b{color:var(--bone);font-weight:600}

  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row .s{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);
          width:22px;flex:none;letter-spacing:.06em}
  .fld{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);
       border-radius:6px;padding:0 9px;flex:1;min-width:0}
  .fld:focus-within{border-color:var(--accent)}
  .fld input{width:100%;min-width:0;background:none;border:0;color:var(--bone);
             font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
             padding:10px 0;text-align:right}
  .fld input:focus{outline:none}
  .fld input::placeholder{color:#4A5563;font-weight:400}
  .fld u{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);
         text-decoration:none;letter-spacing:.08em;padding-left:6px}
  .row .x{color:var(--dim);font-size:13px;flex:none}
  .delta{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;
         width:52px;flex:none;text-align:right}
  .delta.u{color:var(--up)} .delta.d{color:var(--down)} .delta.e{color:var(--dim)}

  .addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:6px;
          padding:8px;width:100%;cursor:pointer;font-family:'IBM Plex Mono',monospace;
          font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
  .hist{margin-top:13px}
  .hist summary{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
                text-transform:uppercase;color:var(--dim);cursor:pointer;padding:4px 0}
  .hist ul{list-style:none;margin-top:8px}
  .hist li{display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;
           color:#B3BECA;padding:5px 0;border-top:1px solid var(--line)}
  .hist li span{color:var(--dim);flex:none;width:56px}

  .finish{padding:22px 16px 30px}
  .finish button{width:100%;padding:15px;cursor:pointer;background:var(--accent);color:var(--ink);
                 border:0;border-radius:8px;font-family:'CloneWars','Rajdhani',sans-serif;font-weight:400;
                 font-size:18px;letter-spacing:.16em;text-transform:uppercase;
                 border-radius:0;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
  .finish button:disabled{background:var(--card2);color:var(--dim);cursor:default}
  .finish p{margin-top:11px;font-size:12.5px;color:var(--dim);text-align:center;line-height:1.5}

  .notes{padding:22px 16px 40px}
  .notes h2{font-family:'CloneWars','Rajdhani',sans-serif;font-weight:400;font-size:17px;letter-spacing:.12em;
            text-transform:uppercase;margin:30px 0 12px;color:var(--wolf)}
  .notes h2:first-child{margin-top:0}
  .notes p{font-size:15px;color:#C4CCD5;margin-bottom:13px}
  .notes p b{color:var(--bone);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;
     text-transform:uppercase;color:var(--dim);font-weight:500}
  td:nth-child(2),td:nth-child(3),th:nth-child(2),th:nth-child(3){text-align:right;
     font-family:'IBM Plex Mono',monospace;font-size:13px}
  td:nth-child(3){color:var(--dim)}
  .reset{margin-top:26px;width:100%;padding:12px;cursor:pointer;background:none;
         border:1px solid var(--line);border-radius:7px;color:var(--dim);
         font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

  /* --- Controles de modo: largo/corto e híbrido/normal --- */
  .modes{display:flex;flex-wrap:wrap;gap:9px;padding:13px 16px 0}
  .segwrap{flex:1;min-width:150px}
  .seglab{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--dim);margin-bottom:5px;display:block}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px}
  .seg button{flex:1;background:none;border:0;cursor:pointer;color:var(--dim);border-radius:5px;
              font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
              text-transform:uppercase;padding:8px 4px;transition:.12s}
  .seg button.on{background:var(--accent);color:var(--ink);font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* --- Selector de unidad kg/lb por variante --- */
  .unitbar{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .unitbar .ul{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--dim)}
  .useg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px}
  .useg button{background:none;border:0;cursor:pointer;color:var(--dim);border-radius:4px;padding:5px 11px;
               font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;transition:.12s}
  .useg button.on{background:var(--card2);color:var(--bone);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}

  /* --- Dropset --- */
  .log .row{gap:5px}
  .log .delta{width:47px;font-size:9px;white-space:nowrap;letter-spacing:0}
  .dsb{flex:none;width:30px;padding:9px 0;background:none;border:1px solid var(--line);border-radius:6px;
       color:var(--dim);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
       letter-spacing:.02em;transition:.12s}
  .dsb.on{border-color:var(--accent);color:var(--accent);background:var(--card2);font-weight:600}
  .dsb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .droprow{display:flex;align-items:center;gap:8px;margin:-3px 0 9px 30px;padding-left:11px;
           border-left:2px solid var(--line)}
  .droprow .dl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
               text-transform:uppercase;color:var(--accent);flex:none}
  .droprow .fld{padding:0 8px}
  .droprow .fld input{font-size:14.5px;padding:7px 0}
  .dnote{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim);
         letter-spacing:.05em;margin:-4px 0 9px 43px}
  .dstep{display:flex;align-items:center;gap:7px;margin:-2px 0 10px 30px;padding-left:11px;
         border-left:2px solid var(--line)}
  .dstep button{flex:none;width:30px;padding:5px 0;background:none;border:1px dashed var(--line);
                border-radius:5px;color:var(--dim);cursor:pointer;
                font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1}
  .dstep button:disabled{opacity:.3;cursor:default}
  .dstep button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dstep span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
              text-transform:uppercase;color:var(--dim)}

  /* --- Equivalencia en la otra unidad --- */
  .equiv{display:flex;gap:7px;align-items:baseline;margin:2px 0 4px 28px;
         font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.03em}
  .equiv b{color:var(--accent);font-weight:600;flex:none}
  .goal .v i{color:var(--dim);font-style:normal;font-size:.9em}

  /* --- Stepper de series --- */
  .stepper{display:flex;align-items:center;gap:9px;margin-top:5px}
  .stepper button{flex:none;width:38px;padding:8px 0;background:none;border:1px dashed var(--line);
                  border-radius:6px;color:var(--dim);cursor:pointer;
                  font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1}
  .stepper button:disabled{opacity:.3;cursor:default}
  .stepper button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .stepper span{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;
                letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

  /* --- Convertidor kg/lb en Notas --- */
  .conv{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:13px}
  .convrow{display:flex;align-items:center;gap:10px}
  .convrow .fld{background:var(--card2)}
  .convrow .sw{color:var(--dim);font-size:16px;flex:none}
  .convtab{margin-top:13px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);
           display:flex;flex-wrap:wrap;gap:5px 14px}
  .convtab b{color:#B3BECA;font-weight:500}


  /* --- Estética 104th Wolfpack --- */
  body{background-image:
         radial-gradient(120% 60% at 50% -10%,rgba(143,163,184,.10),transparent 60%),
         repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
       background-attachment:fixed}
  .top{background:rgba(12,16,21,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .brand .id{display:flex;align-items:center;gap:10px}
  .brand .logo{width:auto;height:38px;filter:drop-shadow(0 0 6px rgba(143,163,184,.25))}
  .brand em{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:8.5px;
            letter-spacing:.22em;text-transform:uppercase;color:var(--wolf);margin-top:3px}
  .brand #stamp{border:1px solid var(--line);padding:4px 8px;color:var(--bone)}
  .brand #stamp::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
            background:var(--accent);margin-right:7px;vertical-align:1px;box-shadow:0 0 6px var(--accent)}
  .tab[aria-selected="true"]{background:linear-gradient(to top,color-mix(in srgb,var(--c) 16%,transparent),transparent 80%)}

  .plate{position:relative;margin:14px 12px 0;border:1px solid var(--line);padding:20px 16px 16px;
         background:linear-gradient(160deg,rgba(143,163,184,.06),transparent 55%)}
  .plate::before,.plate::after{content:'';position:absolute;width:16px;height:16px;border:2px solid var(--accent)}
  .plate::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .plate::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .eyebrow::before{content:'// ';color:var(--dim)}
  .aur{font-family:'Aurebesh',monospace;text-transform:lowercase;letter-spacing:.12em}
  .plate .aur{font-weight:700;font-size:11px;color:var(--accent);opacity:.75;margin:-2px 0 10px}
  .brand em.aur{font-family:'Aurebesh',monospace;font-size:9px;letter-spacing:.14em;text-transform:lowercase}
  .plate .art{position:absolute;top:8px;right:6px;bottom:8px;width:58%;pointer-events:none;
              background:var(--accent);opacity:.26;
              -webkit-mask:var(--art) right center/contain no-repeat;mask:var(--art) right center/contain no-repeat}
  .plate > :not(.art){position:relative}
  .bar{border-radius:0;height:6px;background:repeating-linear-gradient(90deg,var(--card2) 0 10px,var(--ink) 10px 12px)}
  .bar i{box-shadow:0 0 10px var(--accent)}
  .banner{border-radius:0}
  .sets{border-radius:0;border:1px solid var(--line);background:transparent}
  .tick{border-radius:0;transform:rotate(45deg);width:26px;height:26px;margin:2px}
  .tick i{transform:rotate(-45deg);font-style:normal}
  .done .tick{box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
  .seg,.seg button,.useg,.useg button,.opt,.fld,.help,.guide,.goal,.conv,.reset,.addset,.pick{border-radius:0}
  .notes h2::before{content:'▍';color:var(--accent);margin-right:6px}
  .aurgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-bottom:13px}
  .aurgrid div{background:var(--card);border:1px solid var(--line);padding:9px 4px 7px;text-align:center}
  .aurgrid .aur{display:block;font-size:22px;line-height:1.1;color:var(--accent);letter-spacing:0}
  .aurgrid b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--bone);margin-top:5px}
  .aurgrid small{display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;
                 text-transform:uppercase;color:var(--dim);margin-top:2px}
  .aurgrid.num{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
  .aurex{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;background:var(--card);border:1px solid var(--line);padding:11px 13px}
  .aurex .aur{font-size:17px;color:var(--accent)}
  .aurex i{font-style:normal;color:var(--dim)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

const INFO={
 'Press inclinado con mancuernas':{i:'https://wger.de/media/exercise-images/41/Incline-bench-press-1.png',d:'Banco a 30–45°. Bajas las mancuernas a los lados del pecho alto y empujas arriba y ligeramente adentro. El ángulo carga la parte clavicular del pectoral.'},
 'Press inclinado en Hammer':{i:'https://wger.de/media/exercise-images/41/Incline-bench-press-1.png',d:'La máquina de discos con agarres independientes. Mismo ángulo que el banco inclinado, pero guiado: puedes ir más al fallo sin spotter.'},
 'Press inclinado en Smith':{i:'https://wger.de/media/exercise-images/41/Incline-bench-press-1.png',d:'Barra guiada en rieles, banco inclinado debajo. Al ser fija, te deja concentrarte en el pecho sin estabilizar.'},
 'Press inclinado con barra':{i:'https://wger.de/media/exercise-images/41/Incline-bench-press-1.png',d:'Barra libre en banco inclinado. La más pesada del grupo, pero pide técnica y ojalá alguien que te cuide la última serie.'},

 'Press plano con mancuernas':{i:'https://wger.de/media/exercise-images/192/Bench-press-1.png',d:'Banco horizontal. Recorrido más largo que la barra porque las manos bajan más allá del torso, y cada lado trabaja solo.'},
 'Press plano en Smith':{i:'https://wger.de/media/exercise-images/192/Bench-press-1.png',d:'Barra guiada en rieles sobre banco horizontal. Trayectoria fija, así que puedes empujar fuerte sin preocuparte de estabilizar.'},
 'Chest press en máquina':{i:'https://wger.de/media/exercise-images/192/Bench-press-1.png',d:'Máquina sentado con empuje horizontal. La opción segura para llevar al fallo real sin riesgo.'},
 'Dips':{i:'',d:'Cuerpo suspendido entre dos barras paralelas. Inclínate hacia adelante para cargar pecho en vez de tríceps. Anota solo el peso del cinturón.'},
 'Press banca con barra':{i:'https://wger.de/media/exercise-images/192/Bench-press-1.png',d:'El press clásico acostado. Quédate en RIR 1 con técnica intacta; el fallo real déjalo para máquinas.'},

 'Pec deck':{i:'https://wger.de/media/exercise-images/98/Butterfly-machine-2.png',d:'La máquina de mariposa. Sentado, juntas los brazos al frente en arco con el codo semi-fijo. Aísla el pectoral sin que entre el tríceps.'},
 'Cruces en polea a la altura del pecho':{i:'https://wger.de/media/exercise-images/71/Cable-crossover-2.png',d:'Poleas a la altura de los hombros. Juntas las manos al frente del esternón. El vector horizontal pega en la zona media del pecho.'},
 'Cruces en polea de alto a bajo':{i:'https://wger.de/media/exercise-images/71/Cable-crossover-2.png',d:'Poleas arriba, cruzas las manos hacia abajo y adentro, a la altura del ombligo. Enfatiza la porción inferior del pectoral.'},
 'Cruces en polea de bajo a alto':{i:'https://wger.de/media/exercise-images/71/Cable-crossover-2.png',d:'Poleas abajo, subes las manos al frente hasta la altura de la cara. Enfatiza la porción superior, la misma que el inclinado.'},
 'Aperturas con mancuernas en inclinado':{i:'https://wger.de/media/exercise-images/122/Incline-cable-flyes-1.png',d:'Banco inclinado, codos semi-fijos, abres en arco hasta sentir el estiramiento y vuelves. Es donde el pecho más se estira bajo carga.'},

 'Press militar con mancuernas':{i:'https://wger.de/media/exercise-images/123/dumbbell-shoulder-press-large-1.png',d:'Sentado con respaldo, empujas desde los hombros hasta arriba. Las mancuernas permiten una trayectoria más natural que la barra.'},
 'Press militar con barra':{i:'https://wger.de/media/exercise-images/123/dumbbell-shoulder-press-large-1.png',d:'Barra desde los hombros hasta sobre la cabeza. Aprieta glúteo y abdomen para no arquear la espalda baja.'},
 'Press de hombro en máquina':{i:'https://wger.de/media/exercise-images/123/dumbbell-shoulder-press-large-1.png',d:'Empuje vertical guiado. Ideal cuando el hombro viene cansado del press de pecho y quieres control total.'},
 'Press militar en Smith':{i:'https://wger.de/media/exercise-images/123/dumbbell-shoulder-press-large-1.png',d:'Barra en rieles, sentado debajo. Trayectoria fija, sin estabilización, bueno para las series finales.'},
 'Arnold press':{i:'https://wger.de/media/exercise-images/123/dumbbell-shoulder-press-large-1.png',d:'Partes con las palmas mirándote y rotas hacia afuera mientras subes. Suma algo de deltoide anterior por la rotación.'},

 'Elevación lateral en polea':{i:'https://wger.de/media/exercise-images/148/lateral-dumbbell-raises-large-2.png',d:'Un brazo por vez, polea baja cruzada por delante del cuerpo. La polea mantiene tensión constante incluso abajo, donde la mancuerna la pierde.'},
 'Elevación lateral con mancuernas':{i:'https://wger.de/media/exercise-images/148/lateral-dumbbell-raises-large-2.png',d:'De pie, subes los brazos a los lados hasta la altura del hombro. Codo levemente flexionado y sin impulso de cadera.'},
 'Elevación lateral en máquina':{i:'https://wger.de/media/exercise-images/148/lateral-dumbbell-raises-large-2.png',d:'Sentado con los brazos apoyados en las almohadillas. Elimina el balanceo, así que es la más fácil de llevar al fallo limpio.'},
 'Elevación lateral sentado':{i:'https://wger.de/media/exercise-images/148/lateral-dumbbell-raises-large-2.png',d:'Igual que de pie pero sentado en un banco. Al no poder impulsar con las piernas, el deltoide medio hace todo el trabajo.'},

 'Curl inclinado con mancuernas':{i:'',d:'Banco inclinado con los brazos colgando atrás del torso. Esa posición estira la cabeza larga del bíceps, que es la que buscas hoy.'},
 'Curl en polea detrás del cuerpo':{i:'',d:'De pie, un paso adelante de la polea baja, con el brazo quedando detrás del cuerpo. Mismo estiramiento que el inclinado, con tensión constante.'},
 'Curl con EZ codos atrás':{i:'',d:'De pie con la barra EZ, llevando los codos ligeramente detrás del torso y sin dejarlos avanzar. Versión de pie del mismo estímulo.'},

 'Preacher curl con EZ':{i:'https://wger.de/media/exercise-images/193/Preacher-curl-3-1.png',d:'Brazo apoyado en la almohadilla inclinada, barra EZ. El codo queda por delante del cuerpo, lo que carga la cabeza corta del bíceps.'},
 'Preacher curl en máquina':{i:'https://wger.de/media/exercise-images/193/Preacher-curl-3-1.png',d:'La versión con máquina del preacher. Resistencia pareja en todo el recorrido y cero balanceo.'},
 'Spider curl':{i:'',d:'Boca abajo sobre el respaldo de un banco inclinado, con los brazos colgando perpendiculares al suelo. Máxima tensión en la contracción y nada de impulso.'},
 'Curl martillo':{i:'https://wger.de/media/exercise-images/86/Bicep-hammer-curl-1.png',d:'Palmas enfrentadas todo el recorrido, como agarrando un martillo. Pega en el braquial, el músculo bajo el bíceps que empuja el pico hacia arriba.'},
 'Curl martillo estricto':{i:'https://wger.de/media/exercise-images/86/Bicep-hammer-curl-1.png',d:'El mismo agarre neutro, pero con la parte de atrás del brazo apoyada: banco predicador, arm blaster o un respaldo. El codo queda fijo y no hay balanceo, así que todo el peso lo mueven el braquial y el braquiorradial. Usa menos carga que en el martillo libre.'},
 'Curl inverso con EZ':{i:'https://wger.de/media/exercise-images/86/Bicep-hammer-curl-1.png',d:'Agarre pronado, palmas hacia abajo. Braquial y braquiorradial del antebrazo. Usa bastante menos peso del que crees.'},
 'Curl concentrado':{i:'',d:'Sentado, el codo apoyado en la cara interna del muslo. Aislamiento puro, imposible hacer trampa con la espalda.'},

 'Remo con mancuerna a un brazo':{i:'https://wger.de/media/exercise-images/1283/e7262f70-7512-408a-8d00-4c499ef632fc.jpg',d:'Una rodilla y una mano en el banco, la otra mano tira la mancuerna hacia la cadera. El codo va pegado al cuerpo para que trabaje el dorsal.'},
 'Remo en polea baja agarre neutro':{i:'https://wger.de/media/exercise-images/143/Cable-seated-rows-2.png',d:'Sentado frente a la polea baja con el triángulo. Tiras hacia el ombligo con los codos rozando las costillas.'},
 'Remo en máquina agarre neutro':{i:'',d:'Máquina con el pecho apoyado, agarres verticales. El apoyo elimina la espalda baja de la ecuación.'},
 'Remo con barra agarre supino':{i:'https://wger.de/media/exercise-images/110/Reverse-grip-bent-over-rows-1.png',d:'Torso inclinado, palmas hacia arriba. El agarre supino mete el codo al cuerpo y carga bien el dorsal, con algo de bíceps de regalo.'},
 'Meadows row':{i:'https://wger.de/media/exercise-images/1283/e7262f70-7512-408a-8d00-4c499ef632fc.jpg',d:'Remo a un brazo con el extremo de una barra encajada en una esquina, de costado. El ángulo cambia la resistencia a lo largo del recorrido.'},

 'Remo en máquina agarre pronado ancho':{i:'',d:'Pecho apoyado, manos anchas y palmas hacia abajo. El codo sale abierto y pega en trapecio medio y romboides.'},
 'Remo con mancuernas apoyado en banco':{i:'',d:'Chest-supported: tumbado boca abajo en un banco inclinado, remas con las dos mancuernas. Cero trampa con la cadera.'},
 'Remo en polea sentado con barra ancha':{i:'https://wger.de/media/exercise-images/143/Cable-seated-rows-2.png',d:'Igual que el remo en polea pero con barra larga y agarre ancho, tirando hacia el pecho en vez del ombligo.'},
 'Remo en T agarre ancho':{i:'https://wger.de/media/exercise-images/110/Reverse-grip-bent-over-rows-1.png',d:'Barra en T con agarre ancho y torso inclinado. Permite bastante carga con la espalda alta como protagonista.'},
 'Seal row':{i:'',d:'Tumbado boca abajo en un banco alto, con el pecho fijo y los brazos colgando libres. Aísla la espalda por completo: no hay forma de impulsar.'},

 'Lat pulldown agarre neutro estrecho':{i:'',d:'Sentado bajo la polea alta, agarre estrecho con las palmas enfrentadas. El codo baja pegado al torso y estira el dorsal en largo.'},
 'Dominadas supinas o neutras':{i:'',d:'Colgado de la barra con palmas hacia ti o enfrentadas. Anota el peso del cinturón; si vas a cuerpo libre deja 0 y progresa por repeticiones.'},
 'Lat pulldown unilateral':{i:'',d:'Un brazo por vez con agarre simple. Permite más rango y corrige diferencias entre lados.'},
 'Pullover en polea':{i:'',d:'De pie frente a la polea alta, brazos casi rectos, llevas la barra desde arriba hasta los muslos en arco. Aísla el dorsal sin que entre el bíceps.'},

 'Lat pulldown agarre pronado ancho':{i:'',d:'Manos anchas, palmas hacia adelante, tiras al pecho alto. Los codos abiertos cargan la espalda alta más que el dorsal.'},
 'High row en máquina':{i:'',d:'Máquina donde tiras desde arriba hacia abajo y atrás, con el pecho apoyado. Vector diagonal entre el jalón y el remo.'},
 'Dominadas pronadas anchas':{i:'',d:'Colgado con las palmas hacia adelante y las manos anchas. La versión más dura, muy centrada en espalda alta.'},
 'Lat pulldown con codos abiertos':{i:'',d:'Agarre medio pero llevando los codos hacia afuera en vez de pegados. Traslada el trabajo del dorsal al trapecio medio.'},

 'Reverse pec deck':{i:'',d:'El pec deck al revés: pecho contra la almohadilla, abres los brazos hacia atrás. La forma más limpia de aislar el deltoide posterior.'},
 'Cruces invertidos en polea':{i:'',d:'De pie entre dos poleas altas, brazos cruzados que abres hacia afuera y atrás. Tensión constante en todo el arco.'},
 'Pájaros en banco inclinado':{i:'',d:'Boca abajo sobre un banco inclinado, abres las mancuernas hacia los lados. El apoyo evita que uses la espalda baja.'},
 'Face pull':{i:'',d:'Polea a la altura de la cara con cuerda: tiras hacia la frente separando las manos y con los codos altos. Deltoide posterior y rotadores.'},
 'Reverse fly unilateral en polea':{i:'',d:'Un brazo por vez, polea cruzada por delante que abres hacia atrás. El rango es mayor que con las dos manos a la vez.'},

 'Extensión overhead en polea con cuerda':{i:'',d:'De espaldas a la polea, cuerda por detrás de la cabeza, extiendes los codos hacia arriba. El brazo sobre la cabeza estira la cabeza larga del tríceps.'},
 'Extensión overhead con mancuerna sentado':{i:'',d:'Sentado, una mancuerna con las dos manos por detrás de la nuca. Codos apuntando al techo y quietos.'},
 'Press francés con EZ acostado':{i:'',d:'Acostado en banco plano, bajas la EZ hacia la frente doblando solo el codo. Clásico, pero cuida el codo si te molesta.'},
 'Extensión overhead en máquina':{i:'',d:'La versión guiada del overhead. Ideal para las series al fallo sin pelear con la estabilización.'},
 'Extensión overhead unilateral en polea':{i:'',d:'Un brazo por vez con agarre simple por detrás de la cabeza. Corrige asimetrías y da más rango.'},

 'Push-down con cuerda':{i:'',d:'Polea alta, codos pegados al costado, extiendes abriendo la cuerda al final. La apertura suma contracción en la cabeza lateral.'},
 'Push-down con barra recta o V':{i:'',d:'Igual que con cuerda pero con barra fija. Permite más peso, aunque menos rango en la contracción final.'},
 'Push-down unilateral agarre inverso':{i:'',d:'Un brazo con la palma hacia arriba. El agarre supino desplaza el trabajo hacia la cabeza medial del tríceps.'},
 'Fondos en máquina':{i:'',d:'Máquina sentado que replica el fondo. Empujas hacia abajo con el torso vertical, así que carga tríceps más que pecho.'},
 'Press cerrado en Smith':{i:'https://wger.de/media/exercise-images/192/Bench-press-1.png',d:'Press de banca con las manos a la anchura de los hombros en la barra guiada. Compuesto de tríceps con bastante carga.'},

 'Hack squat':{i:'https://wger.de/media/exercise-images/130/Narrow-stance-hack-squats-1-1024x721.png',d:'Máquina con la espalda apoyada en un respaldo inclinado. Carga el cuádriceps a fondo con la espalda baja protegida.'},
 'Sentadilla libre':{i:'https://wger.de/media/exercise-images/191/Front-squat-1-857x1024.png',d:'Barra sobre los trapecios, bajas hasta romper la paralela. La más exigente del día: quédate en RIR 0 a 1 con técnica intacta, sin buscar el fallo real.'},
 'Leg press pies bajos':{i:'',d:'Pies bajos en la plataforma y juntos. Esa posición aumenta el recorrido de la rodilla y carga cuádriceps por sobre glúteo.'},
 'Pendulum squat':{i:'',d:'Máquina donde el recorrido describe un arco en vez de una línea recta. Muy cómoda para la rodilla y brutal para el cuádriceps.'},
 'Sentadilla en Smith pies adelantados':{i:'https://wger.de/media/exercise-images/191/Front-squat-1-857x1024.png',d:'Barra guiada con los pies por delante del cuerpo. Al ser fija la trayectoria, puedes adelantar los pies sin perder el equilibrio.'},

 'Leg extension':{i:'',d:'Sentado, extiendes las rodillas contra el rodillo. Aislamiento puro de cuádriceps y la forma más segura de llegar al fallo.'},
 'Sentadilla búlgara':{i:'',d:'Pie trasero apoyado en un banco, bajas con la pierna delantera. Exige equilibrio pero da un estiramiento enorme de glúteo y cuádriceps.'},
 'Leg press unilateral':{i:'',d:'Una pierna a la vez en la prensa. Corrige diferencias entre lados y te deja cargar fuerte sin comprometer la espalda.'},
 'Zancadas caminando':{i:'https://wger.de/media/exercise-images/113/Walking-lunges-1.png',d:'Avanzas alternando piernas con mancuernas en las manos. Trabajo unilateral con un componente de estabilidad importante.'},
 'Sissy squat':{i:'',d:'Te inclinas hacia atrás dejando que las rodillas avancen, con los talones levantados. Estira el cuádriceps como ningún otro, pero cuida la rodilla.'},

 'Peso muerto rumano con barra':{i:'https://wger.de/media/exercise-images/161/Dead-lifts-2.png',d:'Bisagra de cadera con las piernas casi rectas: llevas la cadera atrás y la barra baja pegada al muslo. Para cuando sientas el estiramiento del isquio, no cuando toque el suelo.'},
 'Peso muerto rumano con mancuernas':{i:'https://wger.de/media/exercise-images/161/Dead-lifts-2.png',d:'Mismo patrón de bisagra pero con mancuernas, que permiten bajar un poco más. Buena opción si la barra te molesta la espalda baja.'},
 'Peso muerto rumano unilateral':{i:'',d:'A una pierna, con la contraria extendida hacia atrás como contrapeso. Menos carga pero mucho más estiramiento y trabajo de estabilidad.'},
 'Good morning':{i:'',d:'Barra sobre los trapecios y bisagra de cadera hacia adelante. Muy exigente para la espalda baja: usa poco peso y prioriza la técnica.'},
 'Hiperextensión 45° con peso':{i:'https://wger.de/media/exercise-images/128/Hyperextensions-1.png',d:'En el banco inclinado de espalda baja, bajas y subes el torso abrazando un disco. Redondea isquios y glúteo sin cargar la columna.'},

 'Curl femoral sentado':{i:'https://wger.de/media/exercise-images/117/seated-leg-curl-large-1.png',d:'Sentado con el rodillo sobre los tobillos. La cadera flexionada estira el isquio de entrada, así que rinde más que el tumbado.'},
 'Curl femoral tumbado':{i:'https://wger.de/media/exercise-images/154/lying-leg-curl-machine-large-1.png',d:'Boca abajo, flexionas las rodillas contra el rodillo. No dejes que la cadera se levante del banco.'},
 'Curl femoral unilateral de pie':{i:'https://wger.de/media/exercise-images/118/standing-leg-curls-large-1.png',d:'Una pierna a la vez, de pie en la máquina. Corrige asimetrías entre lados, que en isquios son frecuentes.'},
 'Curl nórdico':{i:'',d:'De rodillas con los tobillos sujetos, bajas el cuerpo frenando con los isquios. Durísimo y excéntrico puro. Si no aguantas, ayúdate con las manos al llegar abajo.'},

 'Hip thrust':{i:'',d:'Espalda alta apoyada en un banco, barra sobre la cadera, empujas hasta alinear el torso. El mejor ejercicio de glúteo por carga directa.'},
 'Abducción en máquina':{i:'',d:'Sentado, abres las rodillas contra las almohadillas. Inclina el torso hacia adelante para cargar más el glúteo medio.'},
 'Leg press pies altos y anchos':{i:'',d:'Pies arriba y separados en la plataforma. Esa posición reduce el recorrido de la rodilla y pasa el trabajo a glúteo e isquios.'},

const KEY='split4dias:v2', TOP=10, LB=2.20462;
let S={sel:{},done:{},last:{},log:{},hist:{},mode:{},split:'h',unit:{}};
let day='legs', open=null, timer=null, guide=null;

/* modo del día: 'largo' (todo) o 'corto' (solo lo marcado con sh) */
const modeOf=k=>(S.mode&&S.mode[k])||'largo';
/* reparto: 'h' híbrido (brazo cruzado) o 'n' normal (push=tríceps, pull=bíceps) */
const splitOf=()=>S.split||'h';
/* unidad de peso, guardada por variante porque el gym mezcla notaciones */
const unitOf=v=>(S.unit&&S.unit[v])||'kg';

/* ejercicios visibles hoy: filtra por reparto y por modo corto */
function exList(k){
  const sp=splitOf(), md=modeOf(k);
  /* co: solo aparece en corto (versiones fusionadas de dos secciones) */
  return DAYS[k].ex.filter(e=>(!e.only||e.only===sp)&&(md==='largo'?!e.co:!!e.sh));
}
/* series objetivo: en corto usa ss si el ejercicio lo define */
const setsOf=(e,k)=>(modeOf(k)==='corto'&&e.ss)?e.ss:e.s;
/* textos que cambian según el reparto */
const txt=(v)=>(typeof v==='string')?v:(v[splitOf()]||v.h);

/* Guarda donde se pueda: almacenamiento de Claude, si no el del navegador, si no en memoria. */
const mem={};
const STORE={
  async get(){
    if(window.storage){try{const r=await window.storage.get(KEY);if(r&&r.value)return r.value;}catch(e){}}
    try{const v=localStorage.getItem(KEY);if(v)return v;}catch(e){}
    return mem[KEY]||null;
  },
  async set(v){
    mem[KEY]=v;
    if(window.storage){try{await window.storage.set(KEY,v);return;}catch(e){}}
    try{localStorage.setItem(KEY,v);}catch(e){}
  }
};

async function load(){
  try{const v=await STORE.get(); if(v) S=Object.assign(S,JSON.parse(v));}catch(e){}
  ['sel','done','last','log','hist','mode','unit'].forEach(k=>{S[k]=S[k]||{}});
  if(S.split!=='h'&&S.split!=='n') S.split='h';
  migrateDrops();
  render();
}

/* El dropset era uno solo (ds/dw/dr). Ahora es una lista d:[{w,r},...].
   Convierte lo viejo para no perder nada de lo ya anotado. */
function migrateDrops(){
  const fix=function(r){
    if(!r||Array.isArray(r.d)) return;
    if(r.ds&&(r.dw||r.dr)) r.d=[{w:r.dw||'',r:r.dr||''}];
    else if(r.ds) r.d=[{w:'',r:''}];
    else r.d=[];
    delete r.ds;delete r.dw;delete r.dr;
  };
  Object.values(S.log||{}).forEach(d=>Object.values(d||{}).forEach(L=>Array.isArray(L)&&L.forEach(fix)));
  Object.values(S.hist||{}).forEach(H=>Array.isArray(H)&&H.forEach(e=>Array.isArray(e.s)&&e.s.forEach(fix)));
}
function save(){
  clearTimeout(timer);
  timer=setTimeout(()=>{STORE.set(JSON.stringify(S));},350);
}

const g=(o,d,i)=>(S[o][d]&&S[o][d][i])||null;
function set(o,d,i,v){(S[o][d]=S[o][d]||{})[i]=v;save();}
function rows(d,i,n){S.log[d]=S.log[d]||{};if(!S.log[d][i])S.log[d][i]=Array.from({length:n},()=>({w:'',r:''}));return S.log[d][i];}
const nd=x=>(x&&Array.isArray(x.d))?x.d.filter(z=>z.w||z.r).length:0;
const fmt=s=>s.filter(x=>x.w||x.r||nd(x)).map(function(x){
  const n=nd(x);return (x.w||'–')+'×'+(x.r||'–')+(n?'▼'+(n>1?n:''):'');}).join('  ');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
function usedThisWeek(){const u=new Set();['push','pull'].forEach(d=>Object.values(S.sel[d]||{}).forEach(v=>u.add(v)));return u;}

/* Conversión de unidades. Todo lo que se compara pasa por aquí, así que
   cambiar de kg a lb entre sesiones no rompe la progresión. */
const conv=(v,from,to)=>(from===to)?v:(from==='lb'?v/LB:v*LB);
const r1=v=>Math.round(v*10)/10;                 /* una décima basta: el gym no es un laboratorio */
const other=u=>u==='kg'?'lb':'kg';
/* peso de un set expresado en la unidad U, venga de donde venga */
const inU=(w,from,U)=>{const n=num(w);return n===null?null:r1(conv(n,from,U));};

function goal(v){
  const h=S.hist[v], U=unitOf(v);
  if(!h||!h.length) return {c:'none',k:'Sin registro',v:'Primera vez con esta variante. Anota peso y repeticiones para tener contra qué progresar.'};
  const hu=h[0].u||'kg';
  const last=h[0].s.filter(x=>num(x.w)!==null&&num(x.r)!==null);
  if(!last.length) return {c:'none',k:'Sin registro',v:'La última sesión quedó incompleta.'};
  /* la sesión anterior, traída a la unidad de hoy */
  const cv=last.map(x=>({w:inU(x.w,hu,U),r:num(x.r)}));
  const nota=(hu!==U)?' <i>(convertido desde '+hu+')</i>':'';
  const w=Math.max.apply(null,cv.map(x=>x.w));
  if(cv.every(x=>x.r>=TOP))
    return {c:'rise',k:'Sube el peso',v:'Cerraste <b>'+TOP+' repeticiones en todas las series</b> con '+w+' '+U+nota+'. Sube al siguiente incremento y vuelve a 8.'};
  return {c:'hold',k:'Mismo peso',v:'Última vez: <b>'+cv.map(x=>x.w+'×'+x.r).join('  ')+' '+U+'</b>'+nota+'. Mantén el peso y busca una repetición más en cada serie.'};
}

/* pu = unidad en que se anotó la serie anterior; se convierte antes de comparar */
function delta(cur,prev,u,pu){
  const cw=num(cur.w),cr=num(cur.r);
  if(cw===null||cr===null||!prev) return {c:'',x:''};
  const cr2=num(prev.r); const pw=inU(prev.w,pu||'kg',u||'kg');
  if(pw===null||cr2===null) return {c:'',x:''};
  const U=u||'kg', d=r1(cw-pw);
  /* zona muerta: bajo esto es ruido de redondeo entre unidades, no progreso real */
  const tol=(U==='lb')?0.5:0.25;
  if(d>tol) return {c:'u',x:'+'+d+' '+U};
  if(d<-tol) return {c:'d',x:'-'+Math.abs(d)+' '+U};
  if(cr>cr2) return {c:'u',x:'+'+(cr-cr2)+' rep'};
  if(cr<cr2) return {c:'d',x:'-'+(cr2-cr)+' rep'};
  return {c:'e',x:'='};
}

function renderTabs(){
  document.getElementById('tabs').innerHTML=
    Object.keys(DAYS).map(k=>{const d=DAYS[k];
      return '<button class="tab" role="tab" aria-selected="'+(k===day)+'" style="--c:'+d.color+'" data-go="'+k+'">'+d.label+'<small>'+d.day.slice(0,3)+'</small></button>';}).join('')+
    '<button class="tab" role="tab" aria-selected="'+(day==='notes')+'" style="--c:var(--notes)" data-go="notes">Notas<small>guía</small></button>';

  const cards=list.map((e,i)=>{

    const h=sel?(S.hist[sel]||[]):[], G=sel?goal(sel):null, pset=h.length?h[0].s:null;

        const D2=Array.isArray(r.d)?r.d:[];
        return '<div class="row">'+
          '<span class="s">S'+(k+1)+'</span>'+
          '<label class="fld"><input type="text" inputmode="decimal" placeholder="peso" value="'+r.w+'" data-log="'+id+'" data-set="'+k+'" data-f="w" aria-label="Peso serie '+(k+1)+'"><u>'+UU+'</u></label>'+
          '<span class="x">×</span>'+
          '<label class="fld"><input type="text" inputmode="numeric" placeholder="reps" value="'+r.r+'" data-log="'+id+'" data-set="'+k+'" data-f="r" aria-label="Repeticiones serie '+(k+1)+'"><u>REP</u></label>'+
          '<button class="dsb '+(D2.length?'on':'')+'" data-ds="'+id+'|'+k+'" aria-pressed="'+(D2.length>0)+'" aria-label="Marcar serie '+(k+1)+' como dropset">DS</button>'+
          '<span class="delta '+D.c+'" data-d="'+id+'-'+k+'">'+D.x+'</span></div>'+
          D2.map(function(dr,j){
            return '<div class="droprow"><span class="dl">↓ D'+(j+1)+'</span>'+
            '<label class="fld"><input type="text" inputmode="decimal" placeholder="peso" value="'+(dr.w||'')+'" data-log="'+id+'" data-set="'+k+'" data-di="'+j+'" data-f="w" aria-label="Peso del descuelgue '+(j+1)+' de la serie '+(k+1)+'"><u>'+UU+'</u></label>'+
            '<span class="x">×</span>'+
            '<label class="fld"><input type="text" inputmode="numeric" placeholder="reps" value="'+(dr.r||'')+'" data-log="'+id+'" data-set="'+k+'" data-di="'+j+'" data-f="r" aria-label="Repeticiones del descuelgue '+(j+1)+' de la serie '+(k+1)+'"><u>REP</u></label>'+
          '</div>';}).join('')+
          (D2.length?'<div class="dstep">'+
            '<button data-dsub="'+id+'|'+k+'" aria-label="Quitar un descuelgue">−</button>'+
            '<span>'+D2.length+' descuelgue'+(D2.length===1?'':'s')+'</span>'+
            '<button data-dadd="'+id+'|'+k+'" '+(D2.length>=4?'disabled':'')+' aria-label="Agregar otro descuelgue">+</button>'+
          '</div>':'');}).join('')+
      (eq.length?'<div class="equiv"><b>≈</b>'+eq.join('  ')+' '+O+'</div>':'')+
      '<div class="stepper">'+
        '<button data-sub="'+id+'" '+(L.length<=1?'disabled':'')+' aria-label="Quitar una serie">−</button>'+
        '<span>'+L.length+' serie'+(L.length===1?'':'s')+'</span>'+
        '<button data-add="'+id+'" '+(L.length>=6?'disabled':'')+' aria-label="Agregar una serie">+</button>'+
      '</div>'+
      (h.length?'<details class="hist"><summary>Historial · '+h.length+' sesiones</summary><ul>'+
        h.slice(0,6).map(x=>'<li><span>'+x.d+'</span>'+(fmt(x.s)||'—')+' '+(x.u||'kg')+'</li>').join('')+'</ul></details>':'')+
      '</div>' : '';

    return '<section class="card '+(isDone?'done':'')+' '+(isOpen?'open':'')+'">'+
      '<button class="head" data-open="'+id+'" aria-expanded="'+isOpen+'">'+
        '<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="body">'+
          '<span class="name">'+e.n+'</span>'+
          '<span class="target">'+e.t+'</span>'+
          (sel?'<span class="pick"><b>HOY</b>'+sel+'</span>':'')+
          (!sel&&prev?'<span class="prev">última vez · '+prev+'</span>':'')+
          (logged?'<span class="tally">'+logged+'</span>':'')+
        '</span>'+
        '<span class="right">'+
          '<span class="sets">'+nS+'×</span>'+
          '<span class="tick" role="checkbox" aria-checked="'+isDone+'" aria-label="Marcar hecho" data-tick="'+id+'"><i>✓</i></span>'+
          '<span class="chev">▾</span>'+
        '</span></button>'+
      '<div class="panel"><div class="opthead">Elige la que esté libre</div>'+
        e.o.map(function(o){
          const key=id+'|'+o, inf=INFO[o], isG=guide===key;
          return '<div class="optrow">'+
            '<button class="opt '+(sel===o?'on':'')+'" data-pick="'+id+'" data-val="'+o+'"><span class="dot"></span>'+o+
              (sel===o?'<span class="flag">elegida</span>':(used.has(o)?'<span class="stale">ya usada</span>':(prev===o?'<span class="stale">última vez</span>':'')))+
            '</button>'+

          '</div>'+

            '<div class="gtx"><p>'+inf.d+'</p>'+
            '<a class="vid" href="https://www.youtube.com/results?search_query='+
              encodeURIComponent(o+' técnica ejercicio')+'" target="_blank" rel="noopener">▶ Ver demostración</a>'+
            (inf.i?'<p class="cred">Ilustración: wger.de · CC BY-SA</p>':'')+
          '</div></div>':'');
        }).join('')+

  }).join('');

  const modeBar='<div class="modes">'+
    '<div class="segwrap"><span class="seglab">Duración</span><div class="seg">'+
      '<button class="'+(md==='largo'?'on':'')+'" data-md="largo">Largo</button>'+

    '</div></div>'+
    ((day==='push'||day==='pull')?'<div class="segwrap"><span class="seglab">Reparto de brazo</span><div class="seg">'+

  return '<div class="plate">'+(d.art?'<i class="art" style="--art:url('+d.art+')"></i>':'')+

}

function renderNotes(){

    ['Deltoide posterior','6','2×'],['Bíceps','6','2×'],['Tríceps','6','2×'],['Cuádriceps','6','1×'],

    .map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('');

  return '<div class="notes">'+

    '<div class="conv"><div class="convrow">'+
      '<label class="fld"><input type="text" inputmode="decimal" id="ckg" data-conv="kg" placeholder="0" aria-label="Kilogramos"><u>KG</u></label>'+

      [[5,11],[10,22],[20,44],[25,55],[45,99],[60,132],[100,220]]
        .map(p=>'<span><b>'+p[0]+'</b> kg ≈ '+p[1]+' lb</span>').join('')+
    '</div></div>'+
    '<p>Escribe en cualquiera de los dos y el otro se calcula solo. La conversión exacta es <b>1 kg = 2,20462 lb</b>. Los discos olímpicos suelen venir en 45, 35, 25, 10, 5 y 2,5 lb, que son 20,4 / 15,9 / 11,3 / 4,5 / 2,3 / 1,1 kg.</p>'+
    '<p>Recuerda que la unidad se elige <b>por variante</b> dentro de cada ficha, no de forma global. Si el hack squat de tu gym está en libras y la prensa en kilos, cada una guarda la suya.</p>'+
    '<p>Cambiar de unidad <b>no rompe la progresión</b>. Si un día anotas en kg y al siguiente en libras, la app convierte por dentro y te sigue comparando contra la sesión anterior. Cuando la comparación viene de otra unidad, el objetivo te lo dice con un <i>(convertido desde…)</i>.</p>'+

    '<p>Cada día tiene dos versiones. <b>Largo</b> es el entrenamiento completo. <b>Corto</b> deja los compuestos con sus series intactas y recorta los aislamientos, apuntando a unos 40 minutos. La elección se guarda por día, así que puedes tener Push en corto y Piernas en largo al mismo tiempo.</p>'+
    '<p>Lo que se recorta en corto no es al azar: se van los segundos ángulos de un mismo músculo y baja una serie en los aislamientos que recuperan rápido. Los compuestos que quedan no pierden series, porque son los que sostienen la progresión.</p>'+
    '<p>En Push y Pull el corto prioriza el brazo. En Push sale el press vertical, porque el press inclinado y la apertura ya le dan estímulo al deltoide anterior, y entra un segundo ejercicio de brazo. En Pull sale el remo para dorsal, porque el remo de espalda alta, el jalón y el deltoide posterior ya cubren la espalda, y entra un segundo ejercicio de brazo. El brazo que entra es el que toca ese día según el reparto: en híbrido, bíceps en Push y tríceps en Pull; en normal, al revés.</p>'+

    '<h2>Híbrido y normal</h2>'+
    '<p>En <b>híbrido</b>, el bíceps va el martes con Push y el tríceps el miércoles con Pull. Así cada brazo entra fresco, sin arrastrar la fatiga de los press ni de los remos.</p>'+
    '<p>En <b>normal</b>, vuelve el reparto clásico: tríceps con Push y bíceps con Pull. Es más lógico de recordar y encadena mejor si haces series seguidas, pero el brazo llega pre-fatigado. Si eliges normal, usa poleas o máquinas para el brazo y no busques el fallo brutal ahí.</p>'+
    '<p>El cambio es global para Push y Pull, no por día suelto. El Upper mantiene bíceps y tríceps en ambos repartos.</p>'+

    '<h2>Dropsets</h2>'+
    '<p>El botón <b>DS</b> de cada serie la marca como dropset y abre una fila extra para anotar el descuelgue: el peso menor y las repeticiones que sacaste con él. Es solo un registro, no cambia la estructura de la serie.</p>'+
    '<p>En el resumen de la ficha las series con dropset salen con un ▼ al lado. Úsalo en la última serie de aislamientos, no en compuestos pesados.</p>'+

    '<h2>Cómo funciona la progresión</h2>'+
    '<p>Doble progresión. Te quedas en el mismo peso hasta llegar a <b>10 repeticiones limpias en todas las series</b>, ahí subes el mínimo incremento disponible y vuelves a 8. La ficha lleva la cuenta: cuando cierras las series en 10, el ejercicio te aparece en verde con <b>Sube el peso</b>.</p>'+
    '<p>El historial se guarda <b>por variante</b>, no por casilla. Hack squat y sentadilla libre son cargas distintas, así que cada una lleva su propia progresión y no se contaminan entre sí.'+(n?' Llevas '+n+' variantes registradas.':'')+'</p>'+
    '<p>Para ejercicios con peso corporal, como dominadas o fondos, anota el <b>peso añadido</b>. Si vas a cuerpo libre deja 0 y progresa por repeticiones.</p>'+

    '<h2>Por qué el híbrido</h2>'+
    '<p>El bíceps entra fresco el martes porque ningún press lo toca, y el tríceps entra fresco el miércoles porque ningún remo ni jalón lo toca. Con dos series al fallo no te sobra margen: si el tríceps llega pre-fatigado de tres movimientos de press, esas dos series valen bastante menos.</p>'+

    '<h2>Por qué este orden</h2>'+
    '<p>Piernas el lunes abre la semana con las piernas frescas después del fin de semana y no le roba nada al torso. Push y Pull van seguidos porque trabajan músculos casi opuestos: mientras entrenas uno, el otro descansa. El jueves libre le da al pecho tres días completos y a la espalda dos antes del Upper del viernes.</p>'+

    '<h2>El punto débil</h2>'+
    '<p>El tríceps queda miércoles y viernes, con un solo día entre medio. Si el viernes rinde mal, usa una variante de polea o máquina y déjalo como trabajo controlado en vez de una serie brutal al fallo.</p>'+

    '<h2>Cuándo va la tercera serie</h2>'+
    '<p>Compuestos que necesitan varias series para expresar la carga real, y músculos chicos que recuperan rápido: deltoide medio, deltoide posterior y gemelos. Si un ejercicio puntual te pide una serie extra, el botón está dentro de la ficha.</p>'+

    '<h2>Fallo real y fallo con riesgo</h2>'+
    '<p>En sentadilla libre, press con barra y RDL pesado quédate en RIR 0 a 1 con técnica intacta. El fallo verdadero guárdalo para máquinas, poleas y mancuernas, donde soltar el peso no te cuesta nada.</p>'+

    '<h2>Cuatro días al fallo</h2>'+
    '<p>Es agresivo. La creatina ayuda en el rendimiento dentro de la serie y algo en recuperación, pero no compensa la fatiga de sistema nervioso ni el daño local de entrenar al fallo cuatro días por semana, tres de ellos seguidos. Respeta el jueves de descanso y haz dos ajustes: lleva la <b>primera</b> serie de los compuestos grandes a RIR 1 y solo la segunda al fallo, y mete una semana de descarga cada 6 a 8 semanas. Si el historial se te aplana en varios ejercicios a la vez, esa es la señal.</p>'+

    '<h2>El costo de bajar a 4 días</h2>'+
    '<p>Piernas a una vez por semana mantiene y progresa lento, no construye. Es un intercambio consciente con tu prioridad. Si quieres corregirlo sin volver a cinco días, pega un curl femoral y un hip thrust al final del Upper.</p>'+

    '<h2>Volumen semanal</h2>'+
    '<table><tr><th>Músculo</th><th>Series</th><th>Frec.</th></tr>'+rws+'</table>'+
    '<h2>Versión</h2>'+
    '<p>Estás usando la <b>'+((document.querySelector('meta[name="app-version"]')||{}).content||'?')+'</b>. La app revisa sola si hay una versión nueva cada vez que la abres y se recarga si la encuentra, así que ya no necesitas cerrarla a la fuerza después de cada actualización. Si no hay señal, simplemente sigue con la que tiene.</p>'+
    '<h2>Traductor de aurebesh</h2>'+
    '<p>El alfabeto de la galaxia, por si quieres descifrar lo que dicen los títulos. Cada letra equivale a una de las nuestras, así que se lee igual que en español.</p>'+
    '<div class="aurgrid">'+AUREBESH.map(([l,n])=>'<div><span class="aur">'+l+'</span><b>'+l.toUpperCase()+'</b><small>'+n+'</small></div>').join('')+'</div>'+
    '<div class="aurgrid num">'+'0123456789'.split('').map(d=>'<div><span class="aur">'+d+'</span><b>'+d+'</b></div>').join('')+'</div>'+
    '<p class="aurex"><span class="aur">104th wolfpack</span> <i>→</i> 104th Wolfpack</p>'+
    '<button class="reset" data-reset>Borrar todo el historial</button></div>';
}

function render(){
  renderTabs();
  document.documentElement.style.setProperty('--accent',day==='notes'?'var(--notes)':DAYS[day].color);
  document.getElementById('stamp').textContent=day==='notes'?'Guía del entrenador':DAYS[day].day;
  document.getElementById('view').innerHTML=day==='notes'?renderNotes():renderDay();
}

/* escribir no redibuja la vista: solo refresca el indicador de esa fila */
document.addEventListener('input',function(e){
  const cv=e.target.closest('[data-conv]');
  if(cv){
    const v=num(cv.value), to=document.getElementById(cv.dataset.conv==='kg'?'clb':'ckg');
    if(!to) return;
    if(cv.value.trim()===''){to.value='';return;}
    if(v===null) return;
    to.value=String(+( cv.dataset.conv==='kg' ? v*LB : v/LB ).toFixed(2)).replace(/\.00$/,'');
    return;
  }
  const el=e.target.closest('[data-log]'); if(!el) return;
  const id=el.dataset.log, k=+el.dataset.set, f=el.dataset.f;
  const ex=DAYS[day].ex.find(x=>x.id===id); if(!ex) return;
  const L=rows(day,id,setsOf(ex,day));
  if(!L[k]) return;
  if(el.dataset.di!==undefined){          /* fila de descuelgue */
    const j=+el.dataset.di;
    if(Array.isArray(L[k].d)&&L[k].d[j]){L[k].d[j][f]=el.value.trim();save();}
    return;
  }
  L[k][f]=el.value.trim(); save();
  const sel=g('sel',day,id), h=sel?(S.hist[sel]||[]):[];
  /* misma unidad de origen que usa renderDay; sin ella una sesión anterior
     en lb se leía como kg y el chip mostraba subidas o bajadas falsas */
  const pu=h.length?(h[0].u||'kg'):'kg';
  const D=delta(L[k], h.length?h[0].s[k]:null, sel?unitOf(sel):'kg', pu);
  const chip=document.querySelector('[data-d="'+id+'-'+k+'"]');
  if(chip){chip.className='delta '+D.c;chip.textContent=D.x;}
});

document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){day=go.dataset.go;open=null;guide=null;scrollTo(0,0);return render();}

  const mdb=e.target.closest('[data-md]');
  if(mdb){S.mode[day]=mdb.dataset.md;open=null;guide=null;save();return render();}

  const spb=e.target.closest('[data-sp]');
  if(spb){S.split=spb.dataset.sp;open=null;guide=null;save();return render();}

  const ub=e.target.closest('[data-unit]');
  if(ub){
    const v=ub.dataset.uv, to=ub.dataset.unit, from=unitOf(v);
    if(from!==to){
      /* convierte lo que ya está escrito hoy, para no retipear nada */
      exList(day).forEach(function(ex){
        if(g('sel',day,ex.id)!==v) return;
        const L=(S.log[day]||{})[ex.id]; if(!L) return;
        L.forEach(function(r){
          const w=num(r.w); if(r.w!==''&&w!==null) r.w=String(r1(conv(w,from,to)));
          if(Array.isArray(r.d)) r.d.forEach(function(z){
            const zw=num(z.w); if(z.w&&zw!==null) z.w=String(r1(conv(zw,from,to)));
          });
        });
      });
      S.unit[v]=to;
    }
    save();return render();
  }

  /* DS enciende o apaga la cascada entera; dadd/dsub agregan o quitan descuelgues */
  const dz=e.target.closest('[data-ds],[data-dadd],[data-dsub]');
  if(dz){
    const kind=dz.dataset.ds?'t':(dz.dataset.dadd?'a':'s');
    const p=(dz.dataset.ds||dz.dataset.dadd||dz.dataset.dsub).split('|'), id=p[0], k=+p[1];
    const ex=DAYS[day].ex.find(x=>x.id===id); if(!ex) return;
    const L=rows(day,id,setsOf(ex,day)); const r=L[k]; if(!r) return;
    if(!Array.isArray(r.d)) r.d=[];
    if(kind==='t') r.d = r.d.length ? [] : [{w:'',r:''}];
    else if(kind==='a'){ if(r.d.length<4) r.d.push({w:'',r:''}); }
    else { r.d.pop(); }
    save();return render();
  }

  const tick=e.target.closest('[data-tick]');
  if(tick){e.stopPropagation();const id=tick.dataset.tick;set('done',day,id,!g('done',day,id));return render();}

  const add=e.target.closest('[data-add]');
  if(add){const id=add.dataset.add,ex=DAYS[day].ex.find(x=>x.id===id);
    if(ex)rows(day,id,setsOf(ex,day)).push({w:'',r:''});save();return render();}

  const sub=e.target.closest('[data-sub]');
  if(sub){const id=sub.dataset.sub,ex=DAYS[day].ex.find(x=>x.id===id);
    if(ex){const L=rows(day,id,setsOf(ex,day)); if(L.length>1)L.pop();}
    save();return render();}

  const gd=e.target.closest('[data-guide]');
  if(gd){const k=gd.dataset.guide;guide=(guide===k?null:k);return render();}

  const pick=e.target.closest('[data-pick]');
  if(pick){
    const id=pick.dataset.pick, v=pick.dataset.val, cur=g('sel',day,id);
    set('sel',day,id,cur===v?null:v);
    S.log[day]=S.log[day]||{}; delete S.log[day][id];
    save(); return render();
  }

  const head=e.target.closest('[data-open]');
  if(head){const id=head.dataset.open;open=(open===id?null:id);guide=null;return render();}

  if(e.target.closest('[data-finish]')){
    const stamp=new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
    exList(day).forEach(function(ex){
      const v=g('sel',day,ex.id), L=(S.log[day]||{})[ex.id];
      if(!v||!L) return;
      const s=L.filter(x=>x.w!==''||x.r!==''||nd(x));
      if(!s.length) return;
      S.hist[v]=[{d:stamp,u:unitOf(v),s:s.map(x=>({w:x.w,r:x.r,
        d:(Array.isArray(x.d)?x.d.filter(z=>z.w||z.r).map(z=>({w:z.w,r:z.r})):[])}))}]
        .concat(S.hist[v]||[]).slice(0,12);
    });
    S.last[day]=Object.assign({},S.last[day],S.sel[day]);
    S.sel[day]={};S.done[day]={};S.log[day]={};
    save();open=null;scrollTo(0,0);return render();
  }

  if(e.target.closest('[data-reset]')){
    S={sel:{},done:{},last:{},log:{},hist:{},mode:{},split:'h',unit:{}};save();return render();}
});

load();

/* --- Auto-actualización ---------------------------------------------------
   iOS guarda en caché la página del ícono y se queda con la versión vieja
   después de cada update. Al abrir la app pedimos el archivo saltándonos la
   caché, comparamos su número de versión con el que está corriendo y, si
   cambió, recargamos una vez. Sin señal falla en silencio y no molesta. */
const VER=(document.querySelector('meta[name="app-version"]')||{}).content||'0';

async function checkUpdate(){
  try{
    const url=location.pathname+'?cb='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    /* regex armado desde string para que este archivo no se auto-detecte */
    const m=txt.match(new RegExp('app-version"\\s+content="([^"]+)"'));
    if(!m) return;
    const nueva=m[1];
    if(nueva===VER) return;
    /* si ya veníamos de un intento con esa misma versión, no insistir */
    if(new URLSearchParams(location.search).get('v')===nueva) return;
    location.replace(location.pathname+'?v='+encodeURIComponent(nueva));
  }catch(e){/* sin señal o error de red: seguimos con lo que ya está cargado */}
}
setTimeout(checkUpdate,1200);
